# Aider Configuration for VIGBOT
# Ensures AI refactoring always executes tests and preserves git commit safety

# Run full backend test suite to automatically catch and revert regressions
test-cmd: "pytest BACKEND/tests -q"

# Auto commit clean refactor steps
auto-commits: true

# Git settings
gitignore: true

# Keep diffs small and focused
map-tokens: 2048

# Architect mode gives high-level design before editing code
architect: true
