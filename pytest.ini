[pytest]
pythonpath = BACKEND
testpaths = BACKEND/tests tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs = scripts .venv node_modules database
markers =
    live: live integration tests that query the running backend server
addopts = -m "not live"
filterwarnings =
    ignore::DeprecationWarning
    ignore::pydantic.warnings.PydanticDeprecatedSince20
